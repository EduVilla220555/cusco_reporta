name: Flutter Mobile CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile_ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'mobile/**'

jobs:
  analyze_and_test:
    name: Análisis Estático y Suite de Pruebas Unitarias
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Instalar Dependencias
        run: flutter pub get

      - name: Verificación de Formato y Análisis Estático
        run: flutter analyze --fatal-infos

      - name: Ejecución de Suite de Pruebas con Cobertura (>90%)
        run: flutter test --coverage

      - name: Subir Reporte de Cobertura como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: mobile/coverage/lcov.info

      - name: Compilación del Artefacto APK Móvil
        run: flutter build apk --debug
